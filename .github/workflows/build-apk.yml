name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle 8.2
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/
          echo "/tmp/gradle-8.2/bin" >> $GITHUB_PATH

      - name: Build both APKs
        working-directory: android
        run: |
          set +e
          gradle :app:assembleDebug :parent-app:assembleDebug --no-daemon 2>&1 | tee /tmp/build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "## :x: Build Errors" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -E "error:|Error|FAILURE|Exception|Could not" /tmp/build.log | head -80 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          exit $BUILD_EXIT

      - name: Upload kid blocker APK
        uses: actions/upload-artifact@v4
        with:
          name: FamilyTime-Kid-Blocker
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload parent app APK
        uses: actions/upload-artifact@v4
        with:
          name: FamilyTime-Parent-App
          path: android/parent-app/build/outputs/apk/debug/parent-app-debug.apk
          retention-days: 30
