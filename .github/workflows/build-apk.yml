name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle 8.2
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/
          echo "/tmp/gradle-8.2/bin" >> $GITHUB_PATH

      - name: Build both APKs
        working-directory: android
        run: |
          set +e
          gradle :app:assembleDebug :parent-app:assembleDebug --no-daemon 2>&1 | tee /tmp/build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          exit $BUILD_EXIT

      - name: Publish build log on failure
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CONTENT=$(tail -300 /tmp/build.log | base64 -w 0)
          SHA=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/contents/build-debug.txt" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('sha',''))" 2>/dev/null || echo "")
          if [ -z "$SHA" ]; then
            curl -s -X PUT -H "Authorization: token $GITHUB_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/${{ github.repository }}/contents/build-debug.txt" \
              -d "{\"message\":\"ci: build log [skip ci]\",\"content\":\"$CONTENT\"}"
          else
            curl -s -X PUT -H "Authorization: token $GITHUB_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/${{ github.repository }}/contents/build-debug.txt" \
              -d "{\"message\":\"ci: build log [skip ci]\",\"content\":\"$CONTENT\",\"sha\":\"$SHA\"}"
          fi

      - name: Upload kid blocker APK
        uses: actions/upload-artifact@v4
        with:
          name: FamilyTime-Kid-Blocker
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload parent app APK
        uses: actions/upload-artifact@v4
        with:
          name: FamilyTime-Parent-App
          path: android/parent-app/build/outputs/apk/debug/parent-app-debug.apk
          retention-days: 30
