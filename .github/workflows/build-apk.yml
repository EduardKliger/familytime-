name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build both APKs
        working-directory: android
        run: gradle :app:assembleDebug :parent-app:assembleDebug

      - name: Upload kid blocker APK
        uses: actions/upload-artifact@v4
        with:
          name: FamilyTime-Kid-Blocker
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload parent app APK
        uses: actions/upload-artifact@v4
        with:
          name: FamilyTime-Parent-App
          path: android/parent-app/build/outputs/apk/debug/parent-app-debug.apk
          retention-days: 30
